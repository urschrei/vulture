name: Publish vulture-wasm to npm

on:
  push:
    tags: ['vulture-wasm-v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      - name: Build vulture-wasm (web target, release)
        run: wasm-pack build vulture-wasm --target web --release
      - name: Patch package.json for npm + Node ESM
        run: node scripts/patch-pkg-json.mjs
      - name: Smoke test the built bundle
        run: node vulture-wasm/tests/smoke.mjs
      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: vulture-wasm/pkg
