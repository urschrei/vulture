[package]
name = "vulture-proptest"
version = "0.0.0"
edition = "2024"
description = "Property-based test harness for the vulture crate, using a brute-force reference solver"
license = "Apache-2.0 OR BlueOak-1.0.0"
repository = "https://github.com/urschrei/vulture"
publish = false

[lib]
name = "vulture_proptest"
path = "src/lib.rs"

[dependencies]
vulture = { workspace = true }
hegel = { git = "https://github.com/hegeldev/hegel-rust", rev = "e8e0192b6ca5004a1230ec1eda336ad25a345a53", package = "hegeltest" }
