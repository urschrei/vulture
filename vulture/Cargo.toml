[package]
name = "vulture"
version = "0.18.0"
edition = "2024"
authors = ["Stephan Hügel <urschrei@gmail.com>"]
description = "Rust implementation of RAPTOR (Round-bAsed Public Transit Routing)"
license = "Apache-2.0"
repository = "https://github.com/urschrei/vulture"
documentation = "https://docs.rs/vulture"
readme = "../README.md"
keywords = ["raptor", "routing", "gtfs", "transport"]

[lib]
name = "vulture"
path = "src/lib.rs"

[features]
default = ["parallel"]
internal = []
dotgraph = ["dep:dot_graph"]
gtfs-bench = []
parallel = ["dep:rayon"]

[dev-dependencies]
anyhow = "1.0.100"
criterion = { version = "0.8", features = ["html_reports", "csv_output"] }
env_logger = "0.11"
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "raptor"
harness = false
required-features = ["internal"]

[[bench]]
name = "gtfs"
harness = false
required-features = ["gtfs-bench"]

[dependencies]
chrono = { version = "0.4", default-features = false }
dot_graph = { version = "0.2", optional = true }
fixedbitset = "0.5"
gtfs-structures = "0.47.0"
jiff = "0.2"
log = "0.4.29"
rayon = { version = "1.10", optional = true }
rstar = "0.12"
smallvec = "1.15.1"
thiserror = "2.0.18"
